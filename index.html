<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Barcode Website</title>
  <style>
    body { margin: 0; font-family: sans-serif; }

    /* Sticky filter bar */
    .filter-bar {
      position: sticky;
      top: 0;
      background: #f8f8f8;
      padding: 10px;
      border-bottom: 1px solid #ccc;
      z-index: 1000;
    }

    .filter-bar label { margin-right: 12px; font-weight: bold; }

    /* Cards grid */
    #barcodeContainer {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      padding: 20px;
    }

    .barcode-card {
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 16px;
      text-align: center;
      font-family: sans-serif;
    }

    .card-row { display: flex; justify-content: space-around; align-items: center; margin-bottom: 10px; }
    .barcode-svg, .qr { width: 80px; height: 80px; }

    .badges span { display: inline-block; background: #007bff; color: white; padding: 2px 6px; margin: 2px; border-radius: 4px; font-size: 12px; }
    .meta { margin-bottom: 10px; }

    table { width: 100%; border-collapse: collapse; margin-top: 8px; }
    td { border: 1px solid #ddd; padding: 4px; font-size: 12px; }
    .address-title { font-weight: bold; text-align: center; }
  </style>
</head>

<!-- JS Libraries -->
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.0/dist/JsBarcode.all.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

<script>
const container = document.getElementById('barcodeContainer');
const parcels = JSON.parse(document.getElementById('parcels-data').textContent);

// Create dynamic filter
const checkboxes = document.querySelectorAll('.filter-bar input[type="checkbox"]');
function applyFilters() {
  const active = Array.from(checkboxes).filter(c=>c.checked).map(c=>c.value);
  document.querySelectorAll('.barcode-card').forEach(card => {
    const types = card.dataset.types.split(',');
    card.style.display = types.some(t => active.includes(t)) ? '' : 'none';
  });
}
checkboxes.forEach(cb => cb.addEventListener('change', applyFilters));

// Utility functions
function escapeHtml(text){ return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function formatAddress(street, house, zip, city){ return `${street} ${house}, ${zip} ${city}`; }
function text(s){ return String(s||''); }

// Create card
function createParcelCard(item){
  const card = document.createElement('div');
  card.className='barcode-card';

  // Collect badge types
  const types=[];
  const badges = document.createElement('div'); badges.className='badges';

  if(item.ParcelShopIdLong){ badges.appendChild(Object.assign(document.createElement('span'), {textContent:'PakkeShop'})); types.push('PakkeShop'); }
  if(item.IsPickAndReturnOrShip){ badges.appendChild(Object.assign(document.createElement('span'), {textContent:'PRS'})); types.push('PRS'); }
  if(item.IsExpress10||item.IsExpress12){ badges.appendChild(Object.assign(document.createElement('span'), {textContent:'Express'})); types.push('Express'); }
  if(item.IsAddresseeOnly){ badges.appendChild(Object.assign(document.createElement('span'), {textContent:'AddressOnly'})); types.push('AddressOnly'); }
  if(item.IsDeposit){ badges.appendChild(Object.assign(document.createElement('span'), {textContent:'IsDeposit'})); types.push('IsDeposit'); }

  card.dataset.types = types.join(',');

  // QR + 1D
  const row = document.createElement('div'); row.className='card-row';
  const qrDiv = document.createElement('div'); qrDiv.className='qr'; row.appendChild(qrDiv);
  const barcodeSvg = document.createElementNS('http://www.w3.org/2000/svg','svg'); barcodeSvg.className='barcode-svg'; row.appendChild(barcodeSvg);

  card.appendChild(row);

  // Meta
  const meta = document.createElement('div'); meta.className='meta';
  meta.appendChild(document.createTextNode(`ParcelId: ${item.ParcelId}`));
  meta.appendChild(document.createElement('br'));
  meta.appendChild(document.createTextNode(`Delivery: ${item.DeliveryName}`));
  meta.appendChild(document.createElement('br'));
  meta.appendChild(document.createTextNode(`Weight: ${parseFloat(item.ActualWeight).toFixed(2)} kg`));
  meta.appendChild(document.createElement('br'));
  meta.appendChild(badges);

  if(item.IsDeposit && item.DepositInstruction){
    const instr = document.createElement('div'); instr.style.fontSize='12px'; instr.textContent=`Deposit: ${item.DepositInstruction}`;
    meta.appendChild(instr);
  }

  card.appendChild(meta);

  // FROM / TO table
  const table = document.createElement('table');
  table.innerHTML=`
    <tr><td class="address-title">FROM</td><td class="address-title">TO</td></tr>
    <tr>
      <td>${escapeHtml(formatAddress(item.ShipperStreetName,item.ShipperHouseNumber,item.ShipperZipCode,item.ShipperCity))}</td>
      <td>${escapeHtml(formatAddress(item.DeliveryStreetName,item.DeliveryHouseNumber,item.DeliveryZipCode,item.DeliveryCity))}</td>
    </tr>
  `;
  card.appendChild(table);

  // Generate barcodes
  try{ JsBarcode(barcodeSvg,item.ParcelId||'UNKNOWN',{format:'CODE128',lineColor:'#000',width:2,height:48,displayValue:true,fontSize:12}); }catch(e){}
  try{ new QRCode(qrDiv,{text:item.ParcelId||'',width:72,height:72,correctLevel:QRCode.CorrectLevel.H}); }catch(e){}

  container.appendChild(card);

  // Apply current filter
  applyFilters();
}

// Generate all cards
parcels.forEach(createParcelCard);
</script>
